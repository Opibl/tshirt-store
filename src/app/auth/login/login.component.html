<div class="body">

    <div class="auth">
        <div class="auth__card card">

            <h1 class="auth__titulo">Iniciar sesión</h1>
            <p class="auth__subtitulo">Accede a tu cuenta para ver tus compras y pedidos</p>

            <form (ngSubmit)="login()">

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="input"
                        [(ngModel)]="email"
                        placeholder="correo@ejemplo.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input"
                        [(ngModel)]="password"
                        placeholder="********"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn--primary btn--block"
                    [disabled]="cargando">

                    <span *ngIf="cargando" class="spinner"></span>
                    {{ cargando ? 'Ingresando...' : 'Ingresar' }}

                </button>

            </form>

            <div class="auth__separador"><span>o</span></div>

            <button
                type="button"
                class="btn btn--ghost btn--block"
                (click)="loginConGoogle()"
                [disabled]="cargando">

                <img
                    *ngIf="!cargando"
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    alt=""
                    class="auth__google-logo"
                >
                <span *ngIf="cargando" class="spinner"></span>

                {{ cargando ? 'Abriendo Google...' : 'Continuar con Google' }}

            </button>

            <p class="auth__link">
                ¿No tienes cuenta?
                <a routerLink="/register">Regístrate aquí</a>
            </p>

        </div>
    </div>

</div>
