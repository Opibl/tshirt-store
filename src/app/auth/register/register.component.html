<div class="body">

    <div class="auth">
        <div class="auth__card card">

            <h1 class="auth__titulo">Crear cuenta</h1>
            <p class="auth__subtitulo">Regístrate para comprar y seguir tus pedidos</p>

            <form (ngSubmit)="registrar()">

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        class="input"
                        [(ngModel)]="nombre"
                        placeholder="Tu nombre"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="input"
                        [(ngModel)]="email"
                        placeholder="correo@ejemplo.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input"
                        [(ngModel)]="password"
                        placeholder="********"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirmarPassword">Confirmar contraseña</label>
                    <input
                        type="password"
                        id="confirmarPassword"
                        name="confirmarPassword"
                        class="input"
                        [(ngModel)]="confirmarPassword"
                        placeholder="********"
                        required>
                </div>

                <button type="submit" class="btn btn--primary btn--block" [disabled]="cargando">
                    <span *ngIf="cargando" class="spinner"></span>
                    {{ cargando ? 'Creando cuenta...' : 'Registrarme' }}
                </button>

            </form>

            <p class="auth__link">
                ¿Ya tienes cuenta?
                <a routerLink="/login">Inicia sesión</a>
            </p>
        </div>
    </div>

</div>
