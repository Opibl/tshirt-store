<div class="body">
  <div class="contenedor">

    <div class="ficha">

      <!-- IMAGEN -->
      <div class="ficha__imagen card">
        <img [src]="imagen || '/assets/img/placeholder.svg'" alt="imagen" class="foto">
      </div>

      <!-- INFO -->
      <div class="ficha__info">

        <h1 class="ficha__nombre">{{ nombre }}</h1>
        <p class="ficha__precio">{{ precio | number:'1.0-0' }} CLP</p>

        <p class="ficha__descripcion">{{ descripcion }}</p>

        <div class="selector-talla">

          <p class="label">Talla</p>

          <div class="tallas">
            <button
              *ngFor="let talla of tallas"
              type="button"
              class="talla-btn"
              [class.activa]="tallaSeleccionada === talla"
              (click)="tallaSeleccionada = talla">

              {{ talla }}

            </button>
          </div>

        </div>

        <div class="cantidad">
          <label for="cantidad" class="label">Cantidad</label>

          <input
            id="cantidad"
            type="number"
            min="1"
            class="input cantidad__input"
            [(ngModel)]="cantidadSeleccionada">
        </div>

        <div class="contenedor-botones">

          <button
            class="btn btn--ghost btn--block"
            [disabled]="!tallaSeleccionada"
            (click)="addToCart()">
            <i class="bi bi-cart-plus"></i>
            Agregar al carrito
          </button>

          <button
            class="btn btn--primary btn--block"
            [disabled]="!tallaSeleccionada"
            (click)="comprarAhora()">
            Comprar ahora
          </button>

        </div>

      </div>
    </div>

  </div>
</div>
